# Railway Nixpacks Configuration for Laravel + Inertia Vue 3
[variables]
NIXPACKS_PHP_ROOT_DIR = "/app/public"

[phases.setup]
nixPkgs = ["php84", "php84Packages.composer", "nodejs_20"]

[phases.install]
cmds = [
    "composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader --ignore-platform-reqs",
    "npm install"
]

[phases.build]
cmds = [
    "npm run build"
]

[start]
cmd = "php artisan storage:link && php artisan migrate --force && php artisan db:seed --force && (php artisan schedule:work &) && php artisan serve --host=0.0.0.0 --port=$PORT"
